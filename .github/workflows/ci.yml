name: CI

on:
    push:
        branches: [main]
    pull_request:
        # ready_for_review is not one of the default activity types. It has to be
        # listed explicitly, otherwise a draft PR skipped by the guards below would
        # never run CI at all — marking it ready would trigger nothing and it could
        # be merged without a single check having run.
        types: [opened, synchronize, reopened, ready_for_review]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: Lint and format
        runs-on: ubuntu-latest

        # Draft pull requests still fire the `pull_request` event — the draft flag
        # filters nothing by itself. This condition is what actually skips them.
        # The event_name check keeps pushes to main running, where there is no
        # pull_request object to read.
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

        steps:
            - uses: actions/checkout@v4

            - uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true

            - name: Lint
              run: uv run --only-group dev ruff check .

            - name: Check formatting
              run: uv run --only-group dev ruff format --check .

            - name: Verify the lockfile matches pyproject.toml
              run: uv lock --check

    test:
        name: Tests
        runs-on: ubuntu-latest

        # Same draft guard as the other jobs.
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

        steps:
            - uses: actions/checkout@v4

            - uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true

            # Core dependencies only — no `--extra providers`. That extra pulls
            # the geospatial stack, two of whose packages build from source and
            # need system headers; nothing under `src/` requires them yet.
            #
            # `archive/` is never tested. It is the previous engine, kept as a
            # reference and a regression oracle, and it is not maintained —
            # see archive/README.md.
            #
            # Exit code 5 means "no tests collected", which is the correct state
            # until the work queue lands with its suite (docs/MIGRATION.md step 3).
            # The job stays wired up rather than deleted so that the day a test
            # appears, CI enforces it without anyone remembering to re-add this.
            - name: Run tests
              run: |
                  uv run pytest -q || status=$?
                  if [ "${status:-0}" -eq 5 ]; then
                      echo "::notice::No tests collected yet — see docs/MIGRATION.md step 3."
                      exit 0
                  fi
                  exit "${status:-0}"

    typecheck:
        name: Typecheck (strict)
        runs-on: ubuntu-latest

        # Same draft guard as the lint job above.
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

        # The ratchet is gone. It existed because the old engine reported 58
        # pre-existing errors across 7 files and blocking on zero would have left
        # CI permanently red and therefore ignored. Moving that engine to
        # `archive/` and excluding it made a genuine zero possible, so this job
        # blocks on zero under `strict = true`.
        #
        # No arguments: mypy reads `files = ["src", "tests"]` from pyproject.toml.
        # Passing `mypy .` would override it and walk `archive/` too.
        steps:
            - uses: actions/checkout@v4

            - uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true

            - name: Typecheck
              run: uv run --only-group dev mypy

name: CI

on:
    push:
        branches: [main]
    pull_request:
        # ready_for_review is not one of the default activity types. It has to be
        # listed explicitly, otherwise a draft PR skipped by the guards below would
        # never run CI at all — marking it ready would trigger nothing and it could
        # be merged without a single check having run.
        types: [opened, synchronize, reopened, ready_for_review]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: Lint and format
        runs-on: ubuntu-latest

        # Draft pull requests still fire the `pull_request` event — the draft flag
        # filters nothing by itself. This condition is what actually skips them.
        # The event_name check keeps pushes to main running, where there is no
        # pull_request object to read.
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

        steps:
            - uses: actions/checkout@v4

            - uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true

            - name: Lint
              run: uv run --only-group dev ruff check .

            - name: Check formatting
              run: uv run --only-group dev ruff format --check .

            - name: Verify the lockfile matches pyproject.toml
              run: uv lock --check

    test:
        name: Tests
        runs-on: ubuntu-latest

        # Same draft guard as the other jobs.
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

        steps:
            - uses: actions/checkout@v4

            - uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true

            # Core dependencies only — no `--extra providers`. The tests cover
            # streetradar/, which needs aiohttp, boto3 and dotenv and nothing
            # that builds from source, so this step needs no system packages.
            #
            # The provider scripts stay untested until they are ported onto the
            # shared package; testing code that is about to be rewritten buys
            # nothing.
            - name: Run tests
              run: uv run pytest -q

    typecheck:
        name: Typecheck (ratchet)
        runs-on: ubuntu-latest

        # Same draft guard as the lint job above.
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

        # The codebase is untyped and mypy currently reports a fixed number of
        # pre-existing errors, recorded in .mypy-baseline. Blocking on zero would
        # leave CI permanently red and therefore ignored; blocking on "no worse
        # than before" makes it useful today and lets the number be driven down.
        #
        # When the count reaches zero, delete .mypy-baseline and replace this job
        # with a plain `uv run --only-group dev mypy .`.
        steps:
            - uses: actions/checkout@v4

            - uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true

            - name: Compare the error count against the baseline
              run: |
                  baseline=$(cat .mypy-baseline)
                  uv run --only-group dev mypy . > mypy-report.txt 2>&1 || true
                  current=$(grep -cE '^[^ ].*: error:' mypy-report.txt || true)

                  echo "baseline: $baseline"
                  echo "current:  $current"
                  echo

                  if [ "$current" -gt "$baseline" ]; then
                      echo "::error::mypy errors went up: $baseline -> $current"
                      echo "New type errors were introduced. The report follows."
                      cat mypy-report.txt
                      exit 1
                  fi

                  if [ "$current" -lt "$baseline" ]; then
                      echo "::notice::mypy errors went down: $baseline -> $current."
                      echo "Lower the number in .mypy-baseline to $current to lock the gain in."
                  fi

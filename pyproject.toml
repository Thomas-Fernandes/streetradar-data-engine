[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["streetradar"]

[project]
name = "streetradar-data-engine"
version = "0.1.0"
description = "Collection and processing pipeline for street-level imagery coverage"
requires-python = ">=3.12"

# Pinned to the versions the pipeline was last known to run on, read from the
# working virtualenv rather than resolved fresh. GeoPandas, Shapely and DuckDB
# all break their APIs across majors, so an unpinned requirements.txt meant the
# pipeline could not be rebuilt reliably.
dependencies = [
    "aiofiles==24.1.0",
    "aiohttp==3.14.3",
    "bd09convertor==0.0.3",
    "boto3==1.40.0",
    "CoordinatesConverter==0.1.5",
    "duckdb==1.3.2",
    "geopandas==1.1.2",
    "mapbox-vector-tile==2.2.0",
    "numpy==2.3.1",
    "osmium==4.1.1",
    "pandas==2.3.1",
    "pillow==12.3.0",
    "psutil==7.0.0",
    "pyarrow==23.0.1",
    "pycairo==1.28.0",
    "pyexiv2==2.15.4",
    "pyfrpc==0.2.13",
    "pyproj==3.7.1",
    "python-dotenv==1.1.1",
    "requests==2.33.0",
    "scipy==1.16.0",
    "shapely==2.1.1",
    "streetlevel==0.12.4",
    # Not imported by any of our code. It arrives through streetlevel ->
    # pyequilib and is declared here only so the CPU-index pin below applies —
    # `tool.uv.sources` does not reach transitive dependencies.
    "torch==2.13.0",
    "uvloop==0.21.0",
]

[project.optional-dependencies]
# Airflow is only needed to run dags/. It is deliberately not a core dependency:
# the scripts are plain Python and must stay runnable without a scheduler.
airflow = ["apache-airflow==3.2.2"]

[dependency-groups]
# ruff and mypy are pinned exactly: the mypy error count in .mypy-baseline is
# version-sensitive, so a floating version would make the CI ratchet drift on
# its own.
dev = ["ruff==0.16.2", "mypy==2.3.0", "pytest>=8.4", "pytest-asyncio>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every test in tests/test_http.py is a coroutine; marking each one individually
# adds noise and is easy to forget, which makes the test silently pass.
asyncio_mode = "auto"

# streetlevel depends on pyequilib, which depends on torch. The default wheel
# drags in the whole CUDA runtime — nvidia/* alone is 2.7 GB — for a pipeline
# that never touches a GPU and only uses streetlevel to read panorama metadata.
# Pinning torch to the CPU index takes the container from 5.8 GB to roughly a
# quarter of that.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["venv", "airflow", "data"]

[tool.ruff.lint]
select = [
    "F",   # pyflakes — unused imports, undefined names, genuine bugs
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # import sorting
    "UP",  # pyupgrade — modernise for the pinned Python
    "B",   # bugbear — likely bugs and footguns
    "C4",  # comprehension clarity
]
ignore = [
    "E501",  # line length is Ruff-formatter territory, not a lint error
    "B008",  # function call in default argument — common and intentional here
]

[tool.ruff.lint.isort]
# Stated explicitly on purpose. A local AIRFLOW_HOME directory named `airflow`
# makes isort infer the package as first-party, so import order came out
# differently on a developer machine than on a clean CI checkout. Pinning the
# classification keeps the result independent of what happens to be on disk.
known-third-party = ["airflow"]

[tool.ruff.lint.per-file-ignores]
# Airflow DAGs assign a module-level `dag` object that reads as unused.
"dags/*.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
files = ["streetradar", "scripts", "dags", "tests"]
exclude = "(venv|airflow|data)/"

# Every provider ships its own collect_data.py / process_data.py / upload_r2.py,
# so module names collide three ways. These two settings make mypy key on the
# full path instead. The real fix is the shared package that removes the
# duplication in the first place.
explicit_package_bases = true
namespace_packages = true
mypy_path = "."

# The codebase is currently untyped. These stay permissive so mypy reports
# real contradictions instead of 6,800 lines of missing-annotation noise;
# tighten them module by module as the shared package lands in Phase 2.
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streetradar"]

[project]
name = "streetradar-data-engine"
# 0.2.0.dev0 marks the rebuild. 0.1.x is the engine now under `archive/`.
version = "0.2.0.dev0"
description = "Collection and processing pipeline for street-level imagery coverage"
requires-python = ">=3.12"

# Core: what `src/streetradar/` imports, and nothing else. Everything here ships
# wheels, so `uv sync` needs no compiler and no system headers — which is what
# keeps the dev environment at ~130 MB rather than the 1.6 GB the old one reached.
#
# mapbox-vector-tile pulls protobuf, pyclipper and shapely. It is imported lazily
# inside `streetradar.decode` so that the fetch and harvest paths stay importable
# — and testable — without it.
dependencies = [
    "aiohttp==3.14.3",
    "boto3==1.40.0",
    "mapbox-vector-tile==2.2.0",
    # Arrives transitively through mapbox-vector-tile, but `streetradar.apple`
    # imports it directly for Apple's coverage schema, so it is declared. The
    # pin has a floor as well as a ceiling: generated `_pb2` modules refuse to
    # load on a runtime older than the protoc that produced them.
    "protobuf==6.33.6",
    "pyarrow==23.0.1",
    # Mapy speaks FRPC, a binary RPC over HTTP POST. Only the codec is used —
    # `pyfrpc.encode`/`decode` — never its FrpcClient, which would carry its own
    # requests session outside the budget and metrics. See ADR 0015.
    "pyfrpc==0.2.13",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
# NOTE (rebuild): this extra still describes what the *archived* engine needed.
# It is left intact so `archive/` stays runnable as a reference oracle, and will
# be rebuilt as the new core lands. Three of these are already slated to go —
# pycairo (replaced by tippecanoe), pyexiv2 (no EXIF is ever read) and geopandas
# (replaced by shapely + DuckDB spatial). streetlevel and torch are on their way
# out too: Apple's schema is vendored (ADR 0014), so nothing in src/ imports the
# library, and it is kept here only as the oracle the Apple decoder is tested
# against and for archive/. torchvision was never needed — the guard in
# streetlevel.lookaround tests torch, so without torch the import succeeds.
#
# Versions are pinned because GeoPandas, Shapely and DuckDB break their APIs
# across majors, and an unpinned requirements.txt is what made the pipeline
# unreproducible in the first place.
providers = [
    "aiofiles==24.1.0",
    "bd09convertor==0.0.3",
    "CoordinatesConverter==0.1.5",
    "duckdb==1.3.2",
    "geopandas==1.1.2",
    "mapbox-vector-tile==2.2.0",
    "numpy==2.3.1",
    "osmium==4.1.1",
    "pandas==2.3.1",
    "pillow==12.3.0",
    "psutil==7.0.0",
    "pyarrow==23.0.1",
    "pycairo==1.28.0",
    "pyexiv2==2.15.4",
    "pyfrpc==0.2.13",
    "pyproj==3.7.1",
    "requests==2.33.0",
    "scipy==1.16.0",
    "shapely==2.1.1",
    "streetlevel==0.12.4",
    # Not imported by any of our code. It arrives through streetlevel ->
    # pyequilib and is declared here only so the CPU-index pin below applies —
    # `tool.uv.sources` does not reach transitive dependencies.
    "torch==2.13.0",
    "uvloop==0.21.0",
]

[dependency-groups]
# ruff and mypy are pinned exactly. CI blocks on zero mypy errors under
# `strict`, and a floating version would turn an upstream release into a
# surprise red build on an unrelated PR.
dev = ["ruff==0.16.2", "mypy==2.3.0", "pytest>=8.4", "pytest-asyncio>=1.0",
       # Stubs for the google.protobuf imports in the generated Apple schema.
       "types-protobuf>=6.30"]

# `grpcio-tools` is deliberately NOT here. It is only needed to regenerate
# `src/streetradar/proto/apple_coverage_pb2.py{,i}`, which happens when Apple
# changes its format — not on any ordinary run — and its wheels do not cover
# every Python this project claims to support, so it would constrain the
# resolution of everyone else. The command is in the .proto header.

[tool.pytest.ini_options]
testpaths = ["tests"]
# Belt and braces alongside testpaths: unscoped, pytest walks the rootdir and
# tries to collect `archive/tests/`, whose imports no longer resolve — 4
# collection errors and 92 seconds.
norecursedirs = ["archive", "data", ".venv", ".git"]
# Collectors and fetchers are coroutines throughout; marking each test
# individually is noise and is easy to forget, which makes a test silently pass.
asyncio_mode = "auto"

# streetlevel depends on pyequilib, which depends on torch. The default wheel
# drags in the whole CUDA runtime — nvidia/* alone is 2.7 GB — for a pipeline
# that never touches a GPU and only uses streetlevel to read panorama metadata.
# Pinning torch to the CPU index takes the container from 5.8 GB to roughly a
# quarter of that.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py312"
# `archive/` is the previous engine, kept as a reference and a regression oracle.
# It is deliberately not linted, not typed and not fixed — see archive/README.md.
#
# `docs/` is excluded because ruff formats Python inside Markdown code fences,
# and the snippets there are illustrative: deliberately column-aligned to show
# which layer owns which call, and sometimes referencing names that do not exist
# yet. Formatting them destroys the alignment that is the point of the example.
#
# The generated protobuf module is machine output: reformatting it would make
# every regeneration a diff, and it is not ours to style.
extend-exclude = ["archive", "data", "docs", "src/streetradar/proto/apple_coverage_pb2.py*"]

[tool.ruff.lint]
select = [
    "F",   # pyflakes — unused imports, undefined names, genuine bugs
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # import sorting
    "UP",  # pyupgrade — modernise for the pinned Python
    "B",   # bugbear — likely bugs and footguns
    "C4",  # comprehension clarity
]
ignore = [
    "E501",  # line length is Ruff-formatter territory, not a lint error
    "B008",  # function call in default argument — common and intentional here
]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
# The generated protobuf module, and only that file. Its *interface* is still
# fully checked: protoc emits `apple_coverage_pb2.pyi` alongside it, mypy
# prefers the stub, and every call in `streetradar.apple` is typed against it.
# This excludes machine output from being style-checked, not our code from
# being type-checked.
exclude = ["src/streetradar/proto/apple_coverage_pb2\\.py$"]

# Strict from the first commit of the rebuild, with a zero-error baseline.
#
# The old engine reported 58 errors across 7 files and CI could only ratchet
# against that count (.mypy-baseline, now deleted). Excluding `archive/` is what
# made a clean zero possible, and starting strict is the only moment it is free —
# retrofitting strictness is what produced the 58 in the first place.
strict = true

# Third-party geospatial and provider libraries ship no stubs. Reported per
# module rather than globally, so a missing stub is a visible decision.
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["streetlevel.*", "osmium.*", "shapely.*", "pyproj.*", "duckdb.*", "mapbox_vector_tile.*", "pyarrow.*", "pyfrpc.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

# protoc writes `**kwargs: _Optional[_Mapping]` in the stubs it generates, which
# `strict` counts as a missing type argument. One error code, in one generated
# module, and NOT `ignore_errors`: everything else about the stub is still
# checked, which is the whole reason for generating it.
[[tool.mypy.overrides]]
module = ["streetradar.proto.*"]
disable_error_code = ["type-arg"]
